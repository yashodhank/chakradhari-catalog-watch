name: Daily catalog scan

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-catalog-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan public catalog
        run: python scripts/update_catalog.py
      - name: Refresh Indian bullion benchmark rates
        run: python scripts/update_metal_rates.py
      - name: Rebuild public dashboard data
        run: python scripts/build_site.py
      - name: Commit changed observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/products.json
          git diff --cached --quiet || git commit -m "data: daily catalog update $(date -u +%F)"
          git push
